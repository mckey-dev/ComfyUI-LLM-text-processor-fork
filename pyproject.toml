[project]
name = "ComfyUI-LLM-text-processor-fork"
version = "2.0.0"
description = "Fork of ComfyUI-LLM-text-processor. Local GGUF text and image processing in ComfyUI via llama-cli, with keep_in_ram."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
]

[project.urls]
Repository = "https://github.com/mckey-dev/ComfyUI-LLM-text-processor-fork"

[tool.comfy]
DisplayName = "LLM Text Processor (fork)"
